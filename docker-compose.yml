# Production stack on one VM. Secrets: .env (app) and backup.env (backup storage) — never committed.
# Full guide: docs/DEPLOYMENT.md
name: ta-platform

services:
  db:
    image: public.ecr.aws/docker/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ta_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ta -d ta_platform"]
      interval: 5s
      retries: 10
    # No ports: reachable only on the internal Docker network.

  app:
    build: { context: ., target: runtime }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ta:${POSTGRES_PASSWORD}@db:5432/ta_platform?schema=public
      NODE_ENV: production
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads:/app/storage
    depends_on: { db: { condition: service_healthy } }
    # No ports: only Caddy reaches it. The app trusts X-Forwarded-For for rate limiting,
    # which is safe only because nothing else can connect to it.

  caddy:
    image: public.ecr.aws/docker/library/caddy:2.10.0
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

  # One-off: docker compose run --rm migrate
  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://ta:${POSTGRES_PASSWORD}@db:5432/ta_platform?schema=public
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]

  # One-off npm scripts with the app's configuration:
  #   docker compose run --rm tools db:seed          (SEED_DEMO_DATA=false in production!)
  #   docker compose run --rm tools privacy:purge    (daily, from cron)
  tools:
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://ta:${POSTGRES_PASSWORD}@db:5432/ta_platform?schema=public
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads:/app/storage
    entrypoint: ["npm", "run"]
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]

  # Nightly: docker compose run --rm backup /usr/local/bin/backup.sh
  backup:
    build: { context: ./deploy/backup }
    env_file: backup.env
    environment:
      DATABASE_URL: postgresql://ta:${POSTGRES_PASSWORD}@db:5432/ta_platform
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data:ro
    depends_on: { db: { condition: service_healthy } }
    profiles: ["tools"]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
