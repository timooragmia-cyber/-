<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>הגדרה ראשונית — T.A Mortgages</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'">
<style>
body{margin:0;background:#f6f7f9;color:#1d1d1b;font-family:"Segoe UI",Arial,sans-serif}
header{background:#0f3b5f;color:#fff;padding:18px 24px}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;opacity:.85;font-size:14px}
main{padding:20px 24px}label{display:block;margin:12px 0 4px;font-size:14px;font-weight:600}
input[type=email],input[type=password]{width:100%;box-sizing:border-box;padding:9px 10px;border:1px solid #c9ccd1;border-radius:6px;font-size:15px}
.hint{font-size:12px;color:#5b5f66;margin-top:4px}.row{display:flex;gap:8px;align-items:flex-start;margin-top:16px}.row label{margin:0;font-weight:400}
button{margin-top:20px;width:100%;padding:11px;border:0;border-radius:6px;background:#0f3b5f;color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.5}
.err{color:#b42318;font-size:13px;min-height:18px;margin-top:8px}.box{background:#fff8e6;border:1px solid #f0d38a;border-radius:6px;padding:10px;font-size:13px;margin-top:14px}
</style></head>
<body>
<header><h1>ברוכים הבאים ל-T.A Mortgages</h1><p>הגדרה חד-פעמית. כל המידע נשמר במחשב הזה בלבד.</p></header>
<main>
<form id="f" autocomplete="off">
  <label for="email">דוא"ל לכניסה לתוכנה</label>
  <input id="email" type="email" dir="ltr" required placeholder="name@example.com">
  <div class="hint">משמש רק כשם משתמש בתוכנה. לא נשלח לשום מקום.</div>
  <label for="pw">סיסמה (לפחות 10 תווים)</label>
  <input id="pw" type="password" minlength="10" required>
  <label for="pw2">שוב, לאימות</label>
  <input id="pw2" type="password" minlength="10" required>
  <div class="row"><input id="demo" type="checkbox"><label for="demo">להתחיל עם נתוני דמו (משפחות לדוגמה) כדי להכיר את התוכנה</label></div>
  <div class="box">הסיסמה לא ניתנת לשחזור. מומלץ לרשום אותה במקום בטוח. אחרי הכניסה הראשונה, הגדירו <b>גיבוי</b> (בתפריט העליון).</div>
  <div class="err" id="err"></div>
  <button id="go" type="submit">סיום והתחלה</button>
</form>
</main>
<script src="setup.js"></script>
</body></html>
